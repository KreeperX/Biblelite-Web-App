<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblelite</title>
<style>
  :root { --slate:#191B19; --ivory:#F0EBDD; --ash:#A5A69C; --gold:#B89A60; }
  html, body { margin: 0; min-height: 100%; background: var(--slate); color: var(--ivory); }
  body { font-family: Georgia, serif; display: flex; flex-direction: column; align-items: center; justify-content: center;
         min-height: 100vh; padding: 16px; box-sizing: border-box; text-align: center; }
  h1 { font-weight: 400; font-size: 44px; margin: 0 0 12px; }
  p { font-family: system-ui, sans-serif; color: var(--ash); margin: 0; }
  .cross { color: var(--gold); font-size: 32px; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="cross" aria-hidden="true">✝</div>
  <h1>Biblelite</h1>
  <p>Discipline, honesty, and prayer.</p>
</body>
</html>
