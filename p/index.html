<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>A prayer for you · Biblelite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* The card's colours come from the sender's look (see LOOKS below, generated from the app's lib/looks.dart).
     Until a prayer is decoded, dark gold. */
  :root { --bg:#101110; --text:#F0EBDD; --muted:#A5A69C; --accent:#B89A60; --large:#B89A60; --shade:black; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: color-mix(in srgb, var(--bg) 92%, var(--shade)); color: var(--text); }
  body { font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column;
         align-items: center; padding: 32px 16px 48px; }
  .card { position: relative; width: min(100%, 420px); min-height: calc(min(100vw - 32px, 420px) * 1.25);
          background: radial-gradient(110% 55% at 50% -12%, color-mix(in srgb, var(--large) 30%, transparent), transparent 70%), var(--bg);
          border-radius: 8px; padding: 38px 36px 30px; display: flex; flex-direction: column; justify-content: space-between;
          box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .card::after { content: ''; position: absolute; inset: 12px; border: 1px solid color-mix(in srgb, var(--large) 55%, transparent);
                 border-radius: 4px; pointer-events: none; }
  .for { font-size: 13px; font-weight: 600; color: var(--accent); line-height: 1.3; overflow-wrap: anywhere; }
  .text { font-family: 'EB Garamond', Georgia, serif; font-size: 22px; line-height: 1.45; margin: 20px 0 0;
          white-space: pre-wrap; overflow-wrap: anywhere; }
  .foot { display: flex; align-items: flex-end; gap: 6px; margin-top: 28px; }
  .dates { flex: 1; }
  .answered { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .date { font-size: 12px; color: var(--muted); }
  .mark { display: flex; align-items: center; gap: 6px; font-family: 'EB Garamond', Georgia, serif; font-weight: 500;
          font-size: 16px; color: var(--accent); }
  .cross { position: relative; width: 9px; height: 14px; color: var(--large); }
  .cross::before { content: ''; position: absolute; left: 3.5px; top: 0; width: 2px; height: 14px; background: currentColor; }
  .cross::after { content: ''; position: absolute; left: 0; top: 3.8px; width: 9px; height: 2px; background: currentColor; }
  .note { margin-top: 28px; color: var(--muted); font-size: 15px; text-align: center; max-width: 420px; line-height: 1.5; }
  .error { font-family: 'EB Garamond', Georgia, serif; font-size: 26px; text-align: center; margin-top: 30vh; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="card" class="card" hidden>
  <div>
    <div class="for" id="for"></div>
    <p class="text" id="text"></p>
  </div>
  <div class="foot">
    <div class="dates">
      <div class="answered" id="answered" hidden></div>
      <div class="date" id="date"></div>
    </div>
    <span class="cross" aria-hidden="true"></span>
    <span class="mark">Biblelite</span>
  </div>
</main>
<p class="note" id="note" hidden>Get Biblelite to keep your own prayers.</p>
<p class="error" id="error" hidden>This prayer link is incomplete.</p>
<script>
  // The prayer travels in the link's #fragment, which the browser never sends to any server.
  // Same format and checks as decodeLink in the app's lib/prayer_codec.dart.
  // Generated from the app's lib/looks.dart. Keep in step when themes change.
  const LOOKS = {
    'gold.d':   { bg: '#101110', text: '#F0EBDD', muted: '#A5A69C', accent: '#B89A60', large: '#B89A60', dark: true },
    'gold.l':   { bg: '#FBF8F1', text: '#1C1B18', muted: '#6E6C63', accent: '#866629', large: '#A8873F', dark: false },
    'red.d':    { bg: '#101110', text: '#F0EBDD', muted: '#A5A69C', accent: '#FF8A80', large: '#FF8A80', dark: true },
    'red.l':    { bg: '#FBF8F1', text: '#1C1B18', muted: '#6E6C63', accent: '#A30000', large: '#A30000', dark: false },
    'green.d':  { bg: '#101110', text: '#F0EBDD', muted: '#A5A69C', accent: '#7BD97B', large: '#7BD97B', dark: true },
    'green.l':  { bg: '#FBF8F1', text: '#1C1B18', muted: '#6E6C63', accent: '#027304', large: '#027304', dark: false },
    'blue.d':   { bg: '#101110', text: '#F0EBDD', muted: '#A5A69C', accent: '#9AA6FF', large: '#9AA6FF', dark: true },
    'blue.l':   { bg: '#FBF8F1', text: '#1C1B18', muted: '#6E6C63', accent: '#020D73', large: '#020D73', dark: false },
    'purple.d': { bg: '#101110', text: '#F0EBDD', muted: '#A5A69C', accent: '#D99BEE', large: '#D99BEE', dark: true },
    'purple.l': { bg: '#FBF8F1', text: '#1C1B18', muted: '#6E6C63', accent: '#6B0385', large: '#6B0385', dark: false },
    'navy':     { bg: '#0B1140', text: '#F1EEE4', muted: '#A8ADCB', accent: '#D1B900', large: '#D1B900', dark: true },
    'plum':     { bg: '#210440', text: '#F3ECF5', muted: '#B9A8C9', accent: '#C5650D', large: '#C5650D', dark: true },
    'mint':     { bg: '#3AF2B2', text: '#05281B', muted: '#1E5C45', accent: '#990A3C', large: '#990A3C', dark: false },
  };

  const MONTHS =['January','February','March','April','May','June','July','August','September','October','November','December'];
  const chars = s => [...new Intl.Segmenter().segment(s)].length;
  const day = s => {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const [y, m, d] = s.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return date.getMonth() === m - 1 ? date : null;
  };
  const longDate = d => `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

  async function decode(hash) {
    if (!hash.startsWith('#1.') || hash.length > 6000) return null;
    let b64 = hash.slice(3).replace(/-/g, '+').replace(/_/g, '/');
    b64 += '='.repeat((4 - b64.length % 4) % 4);
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const raw = await new Response(stream).arrayBuffer();
    if (raw.byteLength > 64 * 1024) return null;
    const j = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(raw));
    const f = j && j.f, t = j && j.t, d = day(j && j.d), a = j && 'a' in j ? day(j.a) : undefined;
    if (typeof f !== 'string' || !f.trim() || chars(f) > 60) return null;
    if (typeof t !== 'string' || !t.trim() || chars(t) > 2000) return null;
    if (!d || a === null) return null;
    // The sender's look; anything unknown (or from before themes) is dark gold, as in the app.
    const l = typeof j.l === 'string' && Object.hasOwn(LOOKS, j.l) ? j.l : 'gold.d';
    return { f, t, d, a, l };
  }

  // A second link opened in the same tab only changes the #fragment, which doesn't reload the page.
  addEventListener('hashchange', () => location.reload());

  decode(location.hash).catch(() => null).then(p => {
    if (!p) { document.getElementById('error').hidden = false; return; }
    const look = LOOKS[p.l], root = document.documentElement.style;
    for (const [name, value] of [['--bg', look.bg], ['--text', look.text], ['--muted', look.muted],
                                 ['--accent', look.accent], ['--large', look.large]]) {
      root.setProperty(name, value);
    }
    root.setProperty('--shade', look.dark ? 'black' : 'white');
    document.getElementById('for').textContent = `Prayer for ${p.f}`;
    document.getElementById('text').textContent = p.t;
    document.getElementById('date').textContent = longDate(p.d);
    if (p.a) {
      const el = document.getElementById('answered');
      el.textContent = `Answered ${longDate(p.a)}`;
      el.hidden = false;
    }
    document.title = `Prayer for ${p.f} · Biblelite`;
    document.getElementById('card').hidden = false;
    document.getElementById('note').hidden = false;
  });
</script>
</body>
</html>
